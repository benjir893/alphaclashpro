<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="./customeStyle.css" />
  </head>
  <body class="font-poppins">
    <main class="bg-blue-950 min-h-screen hero-bg">
      <section
        id="playnow"
        class="text-white flex flex-col justify-center items-center min-h-screen"
      >
        <div class="flex flex-col justify-center items-center">
          <h1 class="anton-regular text-7xl font-bold">Alpha clash pro</h1>
          <p>Unlash your keyboard kung fu: press Enter to play</p>
          <button
            onclick="playNow()"
            class="btn bg-white text-black p-1 rounded-sm"
          >
            Play Now
          </button>
        </div>
      </section>
      <!-- play ground -->
      <section id="playground" class="hidden">
        <!-- play screen -->
        <div class="flex flex-col justify-center items-center m-10 pt-10">
          <div
            class="border-8 rounded-2xl w-[1020px] h-[350px] flex flex-col justify-between items-center bg-amber-200 text-black text-4xl opacity-40"
          >
            <div class="">
              <p
                class="border-2 rounded-b-lg text-white bg-blue-950 text-sm p-2"
              >
                Dont look at the key board while playing
              </p>
            </div>
            <div class="flex flex-col justify-center items-center h-full">
              <p id="txtpara" class="text-8xl font-bold uppercase">Y</p>
            </div>
          </div>
        </div>
        <!-- key board start -->
        <div class="my-1 flex w-full justify-center gap-1">
          <kbd id="q" class="kbd">q</kbd>
          <kbd id="w" class="kbd">w</kbd>
          <kbd id="e" class="kbd">e</kbd>
          <kbd id="r" class="kbd">r</kbd>
          <kbd id="t" class="kbd">t</kbd>
          <kbd id="y" class="kbd">y</kbd>
          <kbd id="u" class="kbd">u</kbd>
          <kbd id="i" class="kbd">i</kbd>
          <kbd id="o" class="kbd">o</kbd>
          <kbd id="p" class="kbd">p</kbd>
        </div>
        <div class="my-1 flex w-full justify-center gap-1">
          <kbd id="a" class="kbd">a</kbd>
          <kbd id="s" class="kbd">s</kbd>
          <kbd id="d" class="kbd">d</kbd>
          <kbd id="f" class="kbd">f</kbd>
          <kbd id="g" class="kbd">g</kbd>
          <kbd id="h" class="kbd">h</kbd>
          <kbd id="j" class="kbd">j</kbd>
          <kbd id="k" class="kbd">k</kbd>
          <kbd id="l" class="kbd">l</kbd>
        </div>
        <div class="my-1 flex w-full justify-center gap-1">
          <kbd id="z" class="kbd">z</kbd>
          <kbd id="x" class="kbd">x</kbd>
          <kbd id="c" class="kbd">c</kbd>
          <kbd id="v" class="kbd">v</kbd>
          <kbd id="b" class="kbd">b</kbd>
          <kbd id="n" class="kbd">n</kbd>
          <kbd id="m" class="kbd">m</kbd>
          <kbd id="/" class="kbd">/</kbd>
        </div>
        <!-- key board ends -->
        <!-- life score -->
        <div class="flex flex-row justify-around items-center">
          <button  class="btn btn-secondary rounded-full">
            Life-Remain:  <img src="../images/heart.svg" alt="" /> <span id="life">5</span>
          </button>
          <button class="btn btn-secondary rounded-full">
            Scores <img src="../images/dollar.svg" alt="" /><span id="score">0</span>
          </button>
        </div>
      </section>
      <section id="playagain" class="flex flex-col justify-center items-center p-5  min-h-screen custome-hidden">
        <div class="flex flex-col justify-center items-center bg-purple-400 border-2 p-5 rounded-lg">
          <h1 class="text-4xl font-bold pb-5">Final Score : <span id="finalScore"></span></h1>
          <button onclick="playAgain()" class="btn btn-active btn-success">Play Again</button>
          <p class="p-3">practice makes you pro</p>
          <button onclick="exitGame()" id="exit">Exit</button>
        </div>
      </section>
    </main>
    <script src="../scripts/function.js"></script>
    <script src="../scripts/script.js"></script>
  </body>
</html>
